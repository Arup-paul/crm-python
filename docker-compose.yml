services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # your machine's 5433 → the container's 5432 (local Postgres already uses 5432)
    healthcheck:
      # $$ = don't fill in now; the variable is read inside the container when the check runs
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # No ports: only other containers use Redis, over the Docker network (local Redis already uses 6379)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./backend
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: crm-backend:dev
    env_file: .env
    volumes:
      - ./backend:/app   # live code: save a file → runserver reloads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
